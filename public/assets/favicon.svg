<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#FBF8F4"/>
  <!-- Bolder than the on-page mark on purpose: at real favicon size (16px in
       most browser tabs) the delicate site-wide stroke weight disappears
       into a blur. This scale/stroke was picked by rasterizing candidates
       at true 16/24/32px and comparing — thin weights failed, this is the
       thinnest one that still reads as a flower at 16px. -->
  <g fill="none" stroke="#8E5F63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(16 16) scale(1.6)">
    <path d="M0 0 C -2.4 -2.8 -2.6 -6.4 0 -9 C 2.6 -6.4 2.4 -2.8 0 0 Z"/>
    <path d="M0 0 C -2.4 -2.8 -2.6 -6.4 0 -9 C 2.6 -6.4 2.4 -2.8 0 0 Z" transform="rotate(60)"/>
    <path d="M0 0 C -2.4 -2.8 -2.6 -6.4 0 -9 C 2.6 -6.4 2.4 -2.8 0 0 Z" transform="rotate(120)"/>
    <path d="M0 0 C -2.4 -2.8 -2.6 -6.4 0 -9 C 2.6 -6.4 2.4 -2.8 0 0 Z" transform="rotate(180)"/>
    <path d="M0 0 C -2.4 -2.8 -2.6 -6.4 0 -9 C 2.6 -6.4 2.4 -2.8 0 0 Z" transform="rotate(240)"/>
    <path d="M0 0 C -2.4 -2.8 -2.6 -6.4 0 -9 C 2.6 -6.4 2.4 -2.8 0 0 Z" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="1.3"/>
  </g>
</svg>
